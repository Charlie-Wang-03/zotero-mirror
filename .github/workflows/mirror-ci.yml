name: Upstream CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.repository == 'Charlie-Wang-03/zotero-mirror' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate reusable upstream (offline)
        run: python scripts/validate_project.py
